services:
  api:
    build:
      context: ./server
      target: runtime
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - TZ=UTC
      - PORT=5000
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/weather.db
      - TIMEOUT_SECONDS=${TIMEOUT_SECONDS:-3600}
      - KEEP_ALIVE_SECONDS=${KEEP_ALIVE_SECONDS:-3600}
      - INGEST_API_KEY=${INGEST_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: ./scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=UTC
      - API_URL=http://api:5000/api/data
      - INGEST_API_KEY=${INGEST_API_KEY:-}
    volumes:
      # Mount host data directory to persist jsonl files and share with services
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
